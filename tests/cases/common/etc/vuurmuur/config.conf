# vuurmuur config file for the test harness. Every value the generator reads
# is spelled out: the golden must not depend on a default shifting.

SERVICES_BACKEND="textdir"
ZONES_BACKEND="textdir"
INTERFACES_BACKEND="textdir"
RULES_BACKEND="textdir"

# the binaries are never run, the capture hook records them
IPTABLES="/sbin/iptables"
IPTABLES_RESTORE="/sbin/iptables-restore"
IP6TABLES="/sbin/ip6tables"
IP6TABLES_RESTORE="/sbin/ip6tables-restore"
TC="/sbin/tc"
SYSCTL="/sbin/sysctl"
MODPROBE="/sbin/modprobe"

MAX_PERMISSION="0700"
LOGDIR="@SB@/log"

LOAD_MODULES="Yes"
MODULES_WAIT_TIME="0"
NFGRP="8"

DYN_INT_CHECK="No"
DYN_INT_INTERVAL="30"

LOG_POLICY="Yes"
LOG_POLICY_LIMIT="30"
LOG_BLOCKLIST="Yes"
LOG_INVALID="Yes"
LOG_NO_SYN="Yes"
LOG_PROBES="Yes"
LOG_FRAG="Yes"

DROP_INVALID="Yes"
CONNTRACK_ACCOUNTING="Yes"

USE_SYN_LIMIT="Yes"
SYN_LIMIT="10"
SYN_LIMIT_BURST="20"
USE_UDP_LIMIT="Yes"
UDP_LIMIT="15"
UDP_LIMIT_BURST="45"

PROTECT_SYNCOOKIE="Yes"
PROTECT_ECHOBROADCAST="Yes"
