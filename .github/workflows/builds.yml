name: builds

on:
  - push
  - pull_request

permissions: read-all

env:
  # only the scan-build jobs still set the warning set through CFLAGS. Left as it
  # is on purpose: --status-bugs must not turn an analyzer-reported warning into a
  # build failure before the report is written, so this job keeps its policy out of
  # the configure option.
  DEFAULT_CFLAGS: "-Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-function"

  # Apt sometimes likes to ask for user input, this will prevent that.
  DEBIAN_FRONTEND: "noninteractive"

jobs:
  ubuntu-2004:
    name: Ubuntu 20.04
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Install system dependencies
        run: |
            apt update
            apt-get upgrade -y
            apt-get -y install make \
                autoconf \
                build-essential \
                autoconf \
                automake \
                dpkg-dev \
                debhelper \
                libtool \
                make \
                pkg-config \
                libnetfilter-conntrack-dev \
                libnetfilter-log-dev \
                libmnl-dev \
                libncurses5-dev \
                libncursesw5-dev
      - run: ./autogen.sh
      - run: ./configure --enable-werror --prefix=/usr --sysconfdir=/etc
      - run: make -j2
      - run: make install
      - run: make distcheck
      - run: vuurmuur -V
      - run: dpkg-buildpackage

  ubuntu-2204:
    name: Ubuntu 22.04
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Install system dependencies
        run: |
            apt update
            apt-get upgrade -y
            apt-get -y install make \
                autoconf \
                build-essential \
                autoconf \
                automake \
                dpkg-dev \
                debhelper \
                libtool \
                make \
                pkg-config \
                libnetfilter-conntrack-dev \
                libnetfilter-log-dev \
                libmnl-dev \
                libncurses5-dev \
                libncursesw5-dev
      - run: ./autogen.sh
      - run: ./configure --enable-werror --prefix=/usr --sysconfdir=/etc
      - run: make -j2
      - run: make install
      - run: make distcheck
      - run: vuurmuur -V
      - run: dpkg-buildpackage

  ubuntu-2204-installer:
    name: Ubuntu 22.04 Installer
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Install system dependencies
        run: |
            apt update
            apt-get upgrade -y
            apt-get -y install make \
                autoconf \
                build-essential \
                autoconf \
                automake \
                libtool \
                gettext \
                make \
                pkg-config \
                libnetfilter-conntrack-dev \
                libnetfilter-log-dev \
                libmnl-dev \
                libncurses5-dev \
                libncursesw5-dev
      - run: installer/install.sh --defaults --install --build-update
      - run: installer/install.sh --defaults --upgrade --build-update

  ubuntu-2404-sb:
    name: Ubuntu 24.04 scan-buid
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Install system dependencies
        run: |
            apt update
            apt-get upgrade -y
            apt-get -y install make \
                autoconf \
                build-essential \
                autoconf \
                automake \
                clang-tools-18 \
                python3-clang-18 \
                dpkg-dev \
                debhelper \
                libtool \
                make \
                pkg-config \
                libnetfilter-conntrack-dev \
                libnetfilter-log-dev \
                libmnl-dev \
                libncurses5-dev \
                libncursesw5-dev
      - run: ./autogen.sh
      - run: CC=clang-18 CFLAGS="${DEFAULT_CFLAGS}" scan-build-18 ./configure --with-widec=no
      - run: CC=clang-18 scan-build-18 --status-bugs make -j2
      - run: make clean
      - run: CC=clang-18 CFLAGS="${DEFAULT_CFLAGS}" scan-build-18 ./configure --with-widec=yes
      - run: CC=clang-18 scan-build-18 --status-bugs make -j2

  ubuntu-2604-cov:
    name: Ubuntu 26.04 (coverage)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Install system dependencies
        run: |
            apt update
            apt-get upgrade -y
            apt-get -y install make \
                autoconf \
                automake \
                git \
                build-essential \
                libtool \
                gettext \
                pkg-config \
                clang-22 \
                llvm-22 \
                libnetfilter-conntrack-dev \
                libnetfilter-log-dev \
                libmnl-dev \
                libncurses5-dev \
                libncursesw5-dev
      - run: ./autogen.sh
      # identical to the GitLab coverage job (vuurmuur-ci): same compiler,
      # same scope, so both platforms report one number
      - run: |
          CC=clang-22 CFLAGS="-fprofile-instr-generate -fcoverage-mapping -O0" \
            ./configure --disable-shared
      - run: |
          CC=clang-22 CFLAGS="-fprofile-instr-generate -fcoverage-mapping -O0" \
            make -j2
      # %p: every test process (and every vuurmuur process the tests
      # spawn) writes its own profile file, so no merge races
      - run: LLVM_PROFILE_FILE=/tmp/vm-%p.profraw make -k check
      # the suite's binaries: the GitLab coverage job's scope. The program
      # binaries would drag in the untestable vuurmuur_conf TUI - 45% of
      # the product denominator at 0%
      - run: |
          IGN='^/usr/.*|/po/'
          llvm-profdata-22 merge -o /tmp/vm.profdata /tmp/vm-*.profraw
          for b in tests/unit/.libs/* tests/unit/* tests/gen/.libs/* tests/gen/*; do
            [ -x "$b" ] || continue
            llvm-cov-22 export "$b" -instr-profile=/tmp/vm.profdata \
              -format=lcov --ignore-filename-regex="$IGN" --skip-branches \
              2>/dev/null || true
          done > coverage.lcov
      # an empty export must not read as green; the total is max-merged
      # over the duplicate SF sections (covered if any export hit the line)
      - run: |
          grep -q "^SF:" coverage.lcov || { echo "FATAL: no coverage data - export found nothing"; exit 1; }
          python3 - <<'EOF'
          import re
          files = {}
          cur = None
          for line in open('coverage.lcov'):
              m = re.match(r'^SF:(.+)$', line)
              if m:
                  cur = m.group(1)
                  files.setdefault(cur, {})
                  continue
              m = re.match(r'^DA:(\d+),(\d+)', line)
              if m and cur is not None:
                  ln, hits = int(m.group(1)), int(m.group(2))
                  files[cur][ln] = max(files[cur].get(ln, 0), hits)
              if line.startswith('end_of_record:'):
                  cur = None
          tot = sum(len(d) for d in files.values())
          cov = sum(1 for d in files.values() for v in d.values() if v > 0)
          print('coverage: %d files, %d/%d lines (%.1f%%)' % (len(files), cov, tot, cov * 100 / tot))
          EOF
      - name: Upload coverage.lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-${{ github.job }}
          path: coverage.lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          # empty until a CODECOV_TOKEN secret exists; with the token in
          # place, flip fail_ci_if_error to true so a failed upload is
          # visible instead of a quiet green job
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: coverage.lcov
          # the number mostly comes from the gen/ ruleset corpus, not
          # unit tests: name the flag after what the job actually runs
          flags: check

  centos-9-stream:
    name: CentOS 9 Stream
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Install system dependencies
        run: |
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf -y install \
                autoconf \
                automake \
                file-devel \
                gcc \
                gcc-c++ \
                gettext-devel \
                git \
                libmnl-devel \
                libtool \
                libnfnetlink-devel \
                libnetfilter_conntrack-devel \
                libnetfilter_queue-devel \
                libtool \
                make \
                ncurses-devel \
                pkgconfig \
                sudo \
                which
      - run: |
          git clone https://git.netfilter.org/libnetfilter_log/
          cd libnetfilter_log
          bash autogen.sh
          ./configure --prefix=/usr
          make
          make install
          cd ..
      - run: ./autogen.sh
      - run: ./configure --enable-werror --prefix=/usr --sysconfdir=/etc
      - run: make -j2
      - run: make install
      - run: make distcheck
      - run: ldconfig /usr/lib
      - run: vuurmuur -V
