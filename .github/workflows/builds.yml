name: builds

on:
  - push
  - pull_request

permissions: read-all

env:
  # only the scan-build jobs still set the warning set through CFLAGS. Left as it
  # is on purpose: --status-bugs must not turn an analyzer-reported warning into a
  # build failure before the report is written, so this job keeps its policy out of
  # the configure option.
  DEFAULT_CFLAGS: "-Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-function"

  # Apt sometimes likes to ask for user input, this will prevent that.
  DEBIAN_FRONTEND: "noninteractive"

jobs:
  ubuntu-2004:
    name: Ubuntu 20.04
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Install system dependencies
        run: |
            apt update
            apt-get upgrade -y
            apt-get -y install make \
                autoconf \
                build-essential \
                autoconf \
                automake \
                dpkg-dev \
                debhelper \
                libtool \
                make \
                pkg-config \
                libnetfilter-conntrack-dev \
                libnetfilter-log-dev \
                libmnl-dev \
                libncurses5-dev \
                libncursesw5-dev
      - run: ./autogen.sh
      - run: ./configure --enable-werror --prefix=/usr --sysconfdir=/etc
      - run: make -j2
      - run: make install
      - run: make distcheck
      - run: vuurmuur -V
      - run: dpkg-buildpackage

  ubuntu-2204:
    name: Ubuntu 22.04
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Install system dependencies
        run: |
            apt update
            apt-get upgrade -y
            apt-get -y install make \
                autoconf \
                build-essential \
                autoconf \
                automake \
                dpkg-dev \
                debhelper \
                libtool \
                make \
                pkg-config \
                libnetfilter-conntrack-dev \
                libnetfilter-log-dev \
                libmnl-dev \
                libncurses5-dev \
                libncursesw5-dev
      - run: ./autogen.sh
      - run: ./configure --enable-werror --prefix=/usr --sysconfdir=/etc
      - run: make -j2
      - run: make install
      - run: make distcheck
      - run: vuurmuur -V
      - run: dpkg-buildpackage

  ubuntu-2204-installer:
    name: Ubuntu 22.04 Installer
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Install system dependencies
        run: |
            apt update
            apt-get upgrade -y
            apt-get -y install make \
                autoconf \
                build-essential \
                autoconf \
                automake \
                libtool \
                gettext \
                make \
                pkg-config \
                libnetfilter-conntrack-dev \
                libnetfilter-log-dev \
                libmnl-dev \
                libncurses5-dev \
                libncursesw5-dev
      - run: installer/install.sh --defaults --install --build-update
      - run: installer/install.sh --defaults --upgrade --build-update

  ubuntu-2404-sb:
    name: Ubuntu 24.04 scan-buid
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Install system dependencies
        run: |
            apt update
            apt-get upgrade -y
            apt-get -y install make \
                autoconf \
                build-essential \
                autoconf \
                automake \
                clang-tools-18 \
                python3-clang-18 \
                dpkg-dev \
                debhelper \
                libtool \
                make \
                pkg-config \
                libnetfilter-conntrack-dev \
                libnetfilter-log-dev \
                libmnl-dev \
                libncurses5-dev \
                libncursesw5-dev
      - run: ./autogen.sh
      - run: CC=clang-18 CFLAGS="${DEFAULT_CFLAGS}" scan-build-18 ./configure --with-widec=no
      - run: CC=clang-18 scan-build-18 --status-bugs make -j2
      - run: make clean
      - run: CC=clang-18 CFLAGS="${DEFAULT_CFLAGS}" scan-build-18 ./configure --with-widec=yes
      - run: CC=clang-18 scan-build-18 --status-bugs make -j2

  ubuntu-2604-cov:
    name: Ubuntu 26.04 (coverage)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Install system dependencies
        run: |
            apt update
            apt-get upgrade -y
            apt-get -y install make \
                autoconf \
                automake \
                build-essential \
                libtool \
                gettext \
                pkg-config \
                clang-21 \
                llvm-21-dev \
                libnetfilter-conntrack-dev \
                libnetfilter-log-dev \
                libmnl-dev \
                libncurses5-dev \
                libncursesw5-dev
      - run: ./autogen.sh
      # coverage build: instrument with clang, static link so the vuurmuur
      # binary carries the coverage mapping of every object it runs
      - run: |
          CC=clang-21 CFLAGS="-fprofile-instr-generate -fcoverage-mapping -O0" \
            ./configure --disable-shared --prefix=/usr --sysconfdir=/etc
      - run: |
          CC=clang-21 CFLAGS="-fprofile-instr-generate -fcoverage-mapping -O0" \
            make -j2
      # the test suite covers the engine and the library
      - run: make check
      # each of these prints and exits: argument parsing and version only,
      # but it puts the four frontends' startup paths into the count
      - run: ./vuurmuur/vuurmuur -h
      - run: ./vuurmuur/vuurmuur -V
      - run: ./vuurmuur_conf/vuurmuur_conf -V
      - run: ./vuurmuur_log/vuurmuur_log -V
      - run: ./vuurmuur_script/vuurmuur_script -h
      # every process merged its counters into a profraw in its working
      # directory; combine them, then export lcov. One -object per program:
      # the export shows every frontend's files, lib/* is attributed once
      # through the mapping they all share
      - run: |
          llvm-profdata-21 merge -output=coverage.profdata \
            $(find . \( -name '*.profraw' -o -name '*.profdata' \))
          llvm-cov-21 export \
            -instr-profile=coverage.profdata \
            -format=lcov \
            --ignore-filename-regex='^/(root|usr)/.*' \
            --skip-branches \
            -object ./vuurmuur/vuurmuur \
            -object ./vuurmuur_conf/vuurmuur_conf \
            -object ./vuurmuur_log/vuurmuur_log \
            -object ./vuurmuur_script/vuurmuur_script \
            > coverage.lcov
      # assert the export produced data before uploading: without the
      # artifact a green job with no number in the log is undiagnosable
      - run: |
          test -s coverage.lcov
          awk -F: '/^SF:/{f++} /^LF:/{l+=$2} /^LH:/{h+=$2} \
               END{printf "coverage: %d files, %d/%d lines (%.1f%%)\n", f, h, l, h*100/l}' coverage.lcov
      - name: Upload coverage.lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-${{ github.job }}
          path: coverage.lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          # empty until a CODECOV_TOKEN secret exists; with the token in
          # place, flip fail_ci_if_error to true so a failed upload is
          # visible instead of a quiet green job
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: coverage.lcov
          # the number mostly comes from the gen/ ruleset corpus, not
          # unit tests: name the flag after what the job actually runs
          flags: check

  centos-9-stream:
    name: CentOS 9 Stream
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Install system dependencies
        run: |
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf -y install \
                autoconf \
                automake \
                file-devel \
                gcc \
                gcc-c++ \
                gettext-devel \
                git \
                libmnl-devel \
                libtool \
                libnfnetlink-devel \
                libnetfilter_conntrack-devel \
                libnetfilter_queue-devel \
                libtool \
                make \
                ncurses-devel \
                pkgconfig \
                sudo \
                which
      - run: |
          git clone https://git.netfilter.org/libnetfilter_log/
          cd libnetfilter_log
          bash autogen.sh
          ./configure --prefix=/usr
          make
          make install
          cd ..
      - run: ./autogen.sh
      - run: ./configure --enable-werror --prefix=/usr --sysconfdir=/etc
      - run: make -j2
      - run: make install
      - run: make distcheck
      - run: ldconfig /usr/lib
      - run: vuurmuur -V
